name: ga4-loader - build, testes e publicação

# Edite só src/ga4/ga4-loader.js.
# A Action testa, gera o ga4-loader.min.js na raiz, commita e limpa o cache do jsDelivr.
# Se algum teste falhar, o .min.js NÃO é atualizado e as lojas continuam na versão anterior.

on:
  push:
    branches: [main]
    paths:
      - 'src/ga4/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/ga4/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ga4-loader
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build + testes (fonte e minificado)
        run: npm run build:ga4 && npm run test:ga4

      - name: Commit do .min.js
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain ga4-loader.min.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ga4-loader.min.js
            git commit -m "build: ga4-loader.min.js"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits feitos pelo GITHUB_TOKEN não disparam o purge-jsdelivr.yml, então o purge é feito aqui
      - name: Purge jsDelivr (@main)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/ga4-loader.min.js"
          echo "Purge -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "$URL")"
